<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nafi | Creative Developer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <section id="landing" class="hub active">
            <div class="aurora-bg"></div>
            <div class="hero">
                <h1>Hi, I'm Nafi.</h1>
                <p class="subtitle">Creative Developer & Tech Storyteller.</p>
                <div class="dual-gate">
                    <div class="gate-card" data-target="gallery">
                        <div class="gate-preview" style="background-image: url('https://images.unsplash.com/photo-1498050108023-c5249f4df085?q=80&w=800&auto=format&fit=crop')"></div>
                        <div class="gate-content">
                            <span>Explore the Work</span>
                        </div>
                    </div>
                    <div class="gate-card" data-target="library">
                        <div class="gate-preview" style="background-image: url('https://images.unsplash.com/photo-1455390582262-044cdead277a?q=80&w=800&auto=format&fit=crop')"></div>
                        <div class="gate-content">
                            <span>Read the Thoughts</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section id="gallery" class="hub">
            <nav class="hub-nav">
                <button class="nav-btn" data-target="landing">← Back to Portal</button>
                <div class="filter-bar">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="web">Web Apps</button>
                    <button class="filter-btn" data-filter="creative">Creative</button>
                </div>
            </nav>
            <div class="bento-grid">
                <!-- Project items will be injected here by JS -->
            </div>
        </section>

        <section id="library" class="hub">
            <nav class="hub-nav">
                <button class="nav-btn" data-target="landing">← Back to Portal</button>
                <div class="search-container">
                    <input type="text" id="library-search" placeholder="Search thoughts...">
                </div>
            </nav>
            <div class="editorial-stream">
                <!-- Articles will be injected here by JS -->
            </div>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
