<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Trading Panel</title>
  <link rel="stylesheet" href="style.css" />
</head>

  <div id="confirm-overlay" class="confirm-overlay hidden">
    <div class="confirm-box">
      <p style="text-align: center;">Yakin maw close?</p>
      <div class="confirm-actions">
        <button id="confirm-yes">Yup🤙</button>
        <button id="confirm-no">Nah🙅‍♂️</button>
      </div>
    </div>
  </div>
  <div class="panel">
    <div class="panel1 hidden">
      <section class="panel1container"></section>
    </div>
    <div class="panel2">
    <header class="panel-header">
      <div class="title" style="font-weight: 700;">✒️EA TRADING PANEL</div>
      <div class="title-btn">
        <span class="icon-btn icon-secondPanel" style="background: url('src/second-panel.svg');" onclick="SecondPanel()"></span>
        <span class="icon-btn icon-minimize" style="background: url('src/minimize-circle-svgrepo-com.svg');" onclick="backend.minimizeApp()"></span>
        <span class="icon-btn icon-close" style="background: url('src/close-circle-svgrepo-com.svg');" onclick="confirmActionCloseApp()"></span>

    <section class="account">
        <section class="controls">
            <label>
                Lot Size
                <input disabled id="lot" type="number" value="0.01" />
            </label>
            <section class="lot-buttons">
                <button class="decreaseLot redHover redClicked" onclick="changeLot(-0.01)">-</button>
                <button class="increaseLot greenHover greenClicked" onclick="changeLot(0.01)">+</button>
                <button class="resetLot" onclick="changeLot(0)">Reset</button>
            </section>
        </section>
        <section class="tradeStatus">
            <button id="tradeStatusBtn" onclick="changeTradeStatus()">START📈</button>    
        </section>
    </section>

    <hr class="horizontal-divider"/>
    <p class="bias-title">- CURRENT MARKET BIAS -</p>

    <section class="actions">
      <button id="buyBiasBtn" class="biasBtnBuy" onclick="tradeBias(1)">BUY</button>
      <button id="neutralBiasBtn" class="biasBtnNeutral" onclick="tradeBias(0)">NEUTRAL</button>
      <button id="sellBiasBtn" class="biasBtnSell" onclick="tradeBias(-1)">SELL</button>
    </section>
    </div>
  </div>
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
